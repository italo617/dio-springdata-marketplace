services:
  registration-database:
    image: postgres:18.4
    restart: always
    environment:
        POSTGRES_DB: registration
        POSTGRES_USER: app
        POSTGRES_PASSWORD: app
    ports:
        - "5435:5432"
    volumes:
        - registration_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  catalog-database:
    image: postgres:18.4
    restart: always
    environment:
      POSTGRES_DB: catalog
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5436:5432"
    volumes:
      - catalog_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  catalog-metadata-database:
    image: mongo:8.3.8
    ports:
      - "27018:27017"
    volumes:
      - metadata_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 5s
      timeout: 5s
      retries: 5

  catalog-cache:
    image: redis:8.8
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 3

  ticketing-database:
    image: mysql:9.7.2
    environment:
      MYSQL_DATABASE: ticketing
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: app
      MYSQL_PASSWORD: app
    ports:
      - "3307:3306"
    volumes:
      - ticketing_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uapp", "-papp"]
      interval: 5s
      timeout: 5s
      retries: 3

volumes:
  registration_data:
  catalog_data:
  metadata_data:
  ticketing_data: